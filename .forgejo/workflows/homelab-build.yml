name: Forgejo - Build & push homelab image

on:
  push:
    branches: [main]
    paths:
      - "homelab/Dockerfile"
      - "homelab/image/**"
      - "package.json"
      - "pnpm-lock.yaml"
      - "pnpm-workspace.yaml"
      - "src/**"
      - "extensions/**"
      - "ui/**"
      - "tsconfig*.json"
      - ".forgejo/workflows/homelab-build.yml"
  workflow_dispatch: {}

env:
  REGISTRY_PUBLIC: git.leopaska.xyz
  REGISTRY_INTERNAL: forgejo-http.forgejo.svc.cluster.local:3000
  IMAGE_NAME: leo/frack-openclaw

jobs:
  build-and-push:
    runs-on: docker

    steps:
      - name: Build image and push via skopeo
        env:
          TOKEN: ${{ secrets.FORGEJOPACKAGES }}
        run: |
          set -eu
          # Forgejo registry over public host has a Docker 27+ chunked-upload bug
          # ("bad range format: 0--1"). Build locally, then push with skopeo over
          # cluster-internal HTTP which avoids the bug entirely. DOCKER_HOST is
          # already set by the runner pod to the sibling dind sidecar.
          apk add --no-cache git skopeo
          git clone --depth 1 --branch "${GITHUB_REF_NAME}" \
            "http://oauth2:${TOKEN}@${REGISTRY_INTERNAL}/${GITHUB_REPOSITORY}.git" repo
          short_sha="$(printf '%s' "${GITHUB_SHA}" | cut -c1-7)"

          docker build \
            --tag "${REGISTRY_PUBLIC}/${IMAGE_NAME}:homelab" \
            --tag "${REGISTRY_PUBLIC}/${IMAGE_NAME}:${short_sha}" \
            --file repo/homelab/Dockerfile \
            repo

          for tag in homelab "${short_sha}"; do
            skopeo copy --dest-tls-verify=false \
              --dest-creds "${GITHUB_ACTOR}:${TOKEN}" \
              "docker-daemon:${REGISTRY_PUBLIC}/${IMAGE_NAME}:${tag}" \
              "docker://${REGISTRY_INTERNAL}/${IMAGE_NAME}:${tag}"
          done
