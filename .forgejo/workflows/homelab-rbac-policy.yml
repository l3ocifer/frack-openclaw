name: homelab-rbac-policy

on:
  pull_request:
    branches: [main]
    paths:
      - ".gitmodules"
      - "homelab/config/**"
      - "homelab/k8s/**"
      - "homelab/shared"
      - "homelab/scripts/test_rbac_policy.py"
      - ".forgejo/workflows/homelab-rbac-policy.yml"
  push:
    branches: [main]
    paths:
      - ".gitmodules"
      - "homelab/config/**"
      - "homelab/k8s/**"
      - "homelab/shared"
      - "homelab/scripts/test_rbac_policy.py"
      - ".forgejo/workflows/homelab-rbac-policy.yml"
  workflow_dispatch: {}

jobs:
  policy:
    name: policy
    runs-on: docker
    steps:
      - name: Bootstrap checkout and policy runtimes
        run: apk add --no-cache git kubectl nodejs python3 py3-yaml

      - name: Checkout exact revision without persisted credentials
        uses: actions/checkout@v4
        with:
          fetch-depth: 1
          persist-credentials: false
          submodules: false

      - name: Verify committed least-privilege RBAC
        run: |
          set -eu
          python3 homelab/scripts/test_rbac_policy.py

      - name: Fetch pinned homelab renderer dependency
        if: github.event_name != 'pull_request'
        env:
          REPO_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          HOMELAB_URL: https://git.leopaska.xyz/leo/homelab.git
        run: |
          set -eu
          printf '::add-mask::%s\n' "${REPO_TOKEN}"

          shared_entry="$(git ls-tree HEAD -- homelab/shared)"
          shared_sha="$(git rev-parse 'HEAD:homelab/shared')"
          test "$(printf '%s\n' "${shared_entry}" | awk '{print $1 " " $2}')" = '160000 commit'
          test "${#shared_sha}" -eq 40
          case "${shared_sha}" in
            *[!0-9a-f]*) echo 'invalid homelab/shared gitlink' >&2; exit 1 ;;
          esac

          auth_dir="$(mktemp -d /dev/shm/frack-git-auth.XXXXXX)"
          chmod 0700 "${auth_dir}"
          umask 077
          printf '%s' "${REPO_TOKEN}" >"${auth_dir}/password"
          unset REPO_TOKEN
          printf '%s\n' \
            '#!/bin/sh' \
            'case "$1" in' \
            '  *Username*) printf "%s\n" "${GIT_ASKPASS_USERNAME:?}" ;;' \
            '  *Password*) exec cat "${GIT_ASKPASS_PASSWORD_FILE:?}" ;;' \
            '  *) exit 1 ;;' \
            'esac' >"${auth_dir}/askpass"
          chmod 0600 "${auth_dir}/password"
          chmod 0700 "${auth_dir}/askpass"
          cleanup_auth() {
            rm -rf -- "${auth_dir:?}"
          }
          trap cleanup_auth EXIT
          export GIT_ASKPASS="${auth_dir}/askpass"
          export GIT_ASKPASS_USERNAME="${GITHUB_ACTOR}"
          export GIT_ASKPASS_PASSWORD_FILE="${auth_dir}/password"
          export GIT_TERMINAL_PROMPT=0

          git init -q homelab/shared
          git -C homelab/shared fetch -q --depth 1 "${HOMELAB_URL}" "${shared_sha}"
          test "$(git -C homelab/shared rev-parse FETCH_HEAD)" = "${shared_sha}"
          git -C homelab/shared checkout -q --detach "${shared_sha}"
          cleanup_auth
          trap - EXIT
          unset GIT_ASKPASS GIT_ASKPASS_USERNAME GIT_ASKPASS_PASSWORD_FILE

      - name: Verify rendered least-privilege RBAC
        if: github.event_name != 'pull_request'
        run: |
          set -eu
          kubectl kustomize --load-restrictor=LoadRestrictionsNone \
            homelab/k8s >/tmp/frack-rendered.yaml
          FRACK_RBAC_MANIFEST=/tmp/frack-rendered.yaml \
            python3 homelab/scripts/test_rbac_policy.py
