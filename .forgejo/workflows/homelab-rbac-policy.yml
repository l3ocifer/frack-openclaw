name: homelab-rbac-policy

on:
  pull_request:
    branches: [main]
    paths:
      - ".gitmodules"
      - "homelab/config/**"
      - "homelab/k8s/**"
      - "homelab/shared"
      - "homelab/scripts/test_rbac_policy.py"
      - ".forgejo/workflows/homelab-rbac-policy.yml"
  push:
    branches: [main]
    paths:
      - ".gitmodules"
      - "homelab/config/**"
      - "homelab/k8s/**"
      - "homelab/shared"
      - "homelab/scripts/test_rbac_policy.py"
      - ".forgejo/workflows/homelab-rbac-policy.yml"
  workflow_dispatch: {}

jobs:
  policy:
    name: policy
    runs-on: docker
    steps:
      - name: Checkout exact revision without persisted credentials
        uses: actions/checkout@v4
        with:
          fetch-depth: 1
          persist-credentials: false
          submodules: false

      - name: Verify committed least-privilege RBAC
        run: |
          set -eu
          apk add --no-cache git kubectl python3 py3-yaml
          python3 homelab/scripts/test_rbac_policy.py

      - name: Verify rendered least-privilege RBAC
        env:
          REPO_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REGISTRY_INTERNAL: forgejo-http.forgejo.svc.cluster.local:3000
        run: |
          set -eu
          printf '::add-mask::%s\n' "${REPO_TOKEN}"

          auth_dir="$(mktemp -d)"
          chmod 0700 "${auth_dir}"
          umask 077
          printf '%s' "${REPO_TOKEN}" >"${auth_dir}/password"
          unset REPO_TOKEN
          printf '%s\n' \
            '#!/bin/sh' \
            'case "$1" in' \
            '  *Username*) printf "%s\n" "${GIT_ASKPASS_USERNAME:?}" ;;' \
            '  *Password*) exec cat "${GIT_ASKPASS_PASSWORD_FILE:?}" ;;' \
            '  *) exit 1 ;;' \
            'esac' >"${auth_dir}/askpass"
          chmod 0600 "${auth_dir}/password"
          chmod 0700 "${auth_dir}/askpass"
          cleanup_auth() {
            rm -rf -- "${auth_dir:?}"
          }
          trap cleanup_auth EXIT
          export GIT_ASKPASS="${auth_dir}/askpass"
          export GIT_ASKPASS_USERNAME="${GITHUB_ACTOR}"
          export GIT_ASKPASS_PASSWORD_FILE="${auth_dir}/password"
          export GIT_TERMINAL_PROMPT=0

          git config submodule.homelab/shared.url \
            "http://${REGISTRY_INTERNAL}/leo/homelab.git"
          git submodule update --init --depth 1 homelab/shared
          unset GIT_ASKPASS GIT_ASKPASS_USERNAME GIT_ASKPASS_PASSWORD_FILE

          kubectl kustomize --load-restrictor=LoadRestrictionsNone \
            homelab/k8s >/tmp/frack-rendered.yaml
          FRACK_RBAC_MANIFEST=/tmp/frack-rendered.yaml \
            python3 homelab/scripts/test_rbac_policy.py
