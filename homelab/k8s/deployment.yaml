---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: frack
  namespace: agents-shared
  labels:
    app.kubernetes.io/name: frack
    app.kubernetes.io/component: agent
spec:
  replicas: 1
  strategy:
    type: Recreate  # state PVC is RWO; only one pod can mount at a time
  selector:
    matchLabels:
      app.kubernetes.io/name: frack
  template:
    metadata:
      labels:
        app.kubernetes.io/name: frack
        app.kubernetes.io/component: agent
      annotations:
        kustomize.toolkit.fluxcd.io/reconcile: enabled
    spec:
      # ── Scheduling ─────────────────────────────────────────────────
      # NO hard nodeSelector — Frack floats. Soft preference for
      # `thebeast` because the businesses workload is heaviest and
      # thebeast has the most headroom + the production-app namespaces
      # Frack operates against are pinned there. The scheduler is
      # free to land Frack on alef when thebeast is drained / cordoned.
      affinity:
        nodeAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 80
              preference:
                matchExpressions:
                  - key: kubernetes.io/hostname
                    operator: In
                    values: [thebeast]
            - weight: 20
              preference:
                matchExpressions:
                  - key: kubernetes.io/hostname
                    operator: In
                    values: [alef]
      serviceAccountName: frack-ops
      restartPolicy: Always
      securityContext:
        runAsNonRoot: false  # OpenClaw expects /root/.openclaw
        fsGroup: 0
      initContainers:
        # OpenClaw writes runtime state (`.openclaw/`, sessions, caches) into
        # OPENCLAW_WORKSPACE, but our persona ConfigMap is an inherently
        # read-only tmpfs. Seed the writable workspace by copying the
        # persona files in at startup so SOUL.md / AGENTS.md / IDENTITY.md
        # / etc. land in the workspace tree the agent actually uses.
        # Also seed the per-agent auth profile + models registry so the
        # default `main` agent can route inference through LiteLLM
        # without requiring an interactive `openclaw infer model auth login`.
        - name: seed-workspace
          image: busybox:1.37
          command: ["sh", "-c"]
          envFrom:
            - secretRef: { name: frack-secrets }
          args:
            - |
              set -eu
              mkdir -p /workspace /agent-state
              cp -f /persona/*.md /workspace/ 2>/dev/null || true
              ls -la /workspace
              # Per-agent auth-profiles.json — flat provider->credential map.
              # We point both `litellm` (catalog provider) and `openai`
              # (default-fallback provider in OpenClaw's built-in agent
              # runtime) at the same LiteLLM endpoint so every model the
              # built-in catalog references — including `claude-opus-4-6`
              # and `gpt-5.5` — is served by our cluster proxy.
              cat > /agent-state/auth-profiles.json <<JSON
              {
                "litellm": {
                  "type": "api_key",
                  "apiKey": "${LITELLM_API_KEY}",
                  "baseUrl": "http://litellm.inference.svc.cluster.local:4000/v1"
                },
                "openai": {
                  "type": "api_key",
                  "apiKey": "${LITELLM_API_KEY}",
                  "baseUrl": "http://litellm.inference.svc.cluster.local:4000/v1"
                }
              }
              JSON
              # Per-agent models.json — register the LiteLLM model
              # catalog so the agent can pick chat/long/frontier without
              # relying on the global model catalog. Fleet default is
              # `chat`; long/frontier are opt-in only so a wedged long
              # backend cannot hang normal agent work.
              # contextWindow values mirror max_input_tokens in the
              # in-cluster LiteLLM config (40-litellm-config.yaml).
              cat > /agent-state/models.json <<JSON
              {
                "providers": {
                  "litellm": {
                    "baseUrl": "http://litellm.inference.svc.cluster.local:4000/v1",
                    "api": "openai-completions",
                    "apiKey": "${LITELLM_API_KEY}",
                    "request": { "allowPrivateNetwork": true },
                    "models": [
                      {"id":"chat","name":"LiteLLM chat (vllm-chat / Qwen3.5 27B AWQ)","contextWindow":20480,"maxTokens":4096,"input":["text"],"cost":{"input":0,"output":0,"cacheRead":0,"cacheWrite":0}},
                      {"id":"long","name":"LiteLLM long (vllm-long / Qwen3.5 9B AWQ + DeltaNet)","contextWindow":262144,"maxTokens":8192,"input":["text"],"cost":{"input":0,"output":0,"cacheRead":0,"cacheWrite":0}},
                      {"id":"frontier","name":"LiteLLM frontier (Qwen3-Coder 480B MoE, opt-in)","contextWindow":65536,"maxTokens":8192,"input":["text"],"cost":{"input":0,"output":0,"cacheRead":0,"cacheWrite":0}}
                    ]
                  }
                },
                "defaults": {
                  "primary": "litellm/chat",
                  "fallbacks": []
                }
              }
              JSON
              chmod 600 /agent-state/auth-profiles.json
              ls -la /agent-state/
              # Seed a WRITABLE copy of the persona OpenClaw config. The
              # ConfigMap mount itself is read-only, so OpenClaw 401s on
              # boot ("EBUSY: rename openclaw.json.tmp -> openclaw.json")
              # when it tries to persist plugin auto-enable + auth-token
              # changes. Copy the rendered config into the state volume
              # at /openclaw-runtime/openclaw.json — the main container
              # then points OPENCLAW_CONFIG at that path.
              #
              # Idempotent seed: only re-copy when the source ConfigMap
              # content has actually changed (sha256 differs from the
              # marker stored alongside). Otherwise we'd clobber the
              # runtime mutations OpenClaw makes on its writable copy
              # — `gateway.auth.token`, plugin auto-enable bookkeeping,
              # `_meta` block — on every pod restart, forcing a token
              # rotation every time the pod cycles.
              mkdir -p /openclaw-runtime
              src=/openclaw-config-src/openclaw.json
              dst=/openclaw-runtime/openclaw.json
              hash_file=/openclaw-runtime/.configmap-source.sha256
              current_hash=$(sha256sum "$src" | awk '{print $1}')
              stored_hash=$(cat "$hash_file" 2>/dev/null || echo "")
              if [ ! -f "$dst" ] || [ "$current_hash" != "$stored_hash" ]; then
                echo "── seeding openclaw.json from configmap (hash ${stored_hash:-none} -> ${current_hash})"
                cp -f "$src" "$dst"
                chmod 644 "$dst"
                echo "$current_hash" > "$hash_file"
              else
                echo "── openclaw.json runtime copy preserved (configmap unchanged: $current_hash)"
              fi
              # Defensive cleanup at the PVC root (mounted at
              # /openclaw-state-root). A previous deployment template
              # mounted the ConfigMap directly at
              # /root/.openclaw/openclaw.json (read-only subPath) and
              # OpenClaw's atomic-rename writes leaked .tmp / .bak.N
              # files into the state PVC root, which confused its
              # boot-time recovery path. The current deployment routes
              # through /root/.openclaw/runtime-config/ so any
              # openclaw.json* at the PVC root is stale.
              for pat in 'openclaw.json.*.tmp' \
                         'openclaw.json.bak' \
                         'openclaw.json.bak.[0-9]*' \
                         '.openclaw.json.tmp.*'; do
                for f in /openclaw-state-root/$pat; do
                  [ -e "$f" ] || continue
                  echo "── pruning stale $f"
                  rm -f "$f"
                done
              done
              # Stale 0-byte openclaw.json at root (orphaned by old
              # deployments). Leave non-empty files alone — operators
              # may have placed them deliberately.
              if [ -f /openclaw-state-root/openclaw.json ]; then
                size=$(stat -c %s /openclaw-state-root/openclaw.json 2>/dev/null || echo 0)
                if [ "$size" = "0" ]; then
                  echo "── pruning empty /openclaw-state-root/openclaw.json"
                  rm -f /openclaw-state-root/openclaw.json
                fi
              fi
              ls -la /openclaw-runtime/
          volumeMounts:
            - { name: state,           mountPath: /workspace,           subPath: openclaw/workspace }
            - { name: state,           mountPath: /agent-state,         subPath: openclaw/agents/main/agent }
            - { name: state,           mountPath: /openclaw-runtime,    subPath: openclaw/runtime-config }
            # PVC root for openclaw — used by seed-workspace to prune
            # leftover openclaw.json.{tmp,bak.N} debris from a
            # previous deployment template that mounted the ConfigMap
            # directly at /root/.openclaw/openclaw.json. The main
            # container does NOT remount this; it sees the same path
            # via /root/.openclaw (state subPath openclaw).
            - { name: state,           mountPath: /openclaw-state-root, subPath: openclaw }
            - { name: persona,         mountPath: /persona,             readOnly: true }
            - { name: openclaw-config, mountPath: /openclaw-config-src, readOnly: true }
        # Run upstream's own state migrator before the gateway boots.
        #
        # WHY: OpenClaw versions its persisted state, and the state PVC outlives
        # the image. When an upstream sync bumps a schema the gateway refuses to
        # use the old state and says "run openclaw doctor --fix" — but doctor
        # declines to touch the session store while the gateway owns the state
        # directory, so the fix cannot be applied from inside the running pod.
        # Doing it by hand also means scaling the Deployment to 0, which ArgoCD
        # selfHeal immediately reverts. An initContainer is the only place the
        # migration can run with the state dir quiet and still be declarative.
        #
        # This class of failure has bitten twice: the media/session schema bump
        # (schema version 11) and then the legacy exec-approvals file, both of
        # which left the agent up but degraded.
        #
        # `|| true` on purpose: doctor also reports advisory findings that are
        # not migrations (no command owner configured, missing transcript) and
        # exits non-zero for them. Blocking boot on advice would be worse than
        # the problem. A migration that genuinely fails still surfaces — the
        # gateway refuses to start and this container's log names the cause.
        - name: doctor-fix
          image: git.leopaska.xyz/leo/frack-openclaw:homelab
          command: ["sh", "-c"]
          args:
            - |
              node /opt/openclaw/openclaw.mjs doctor --fix 2>&1 || true
          volumeMounts:
            - { name: state, mountPath: /root/.openclaw,                subPath: openclaw }
            - { name: state, mountPath: /root/.openclaw/workspace-rw,   subPath: openclaw/workspace }
            - { name: state, mountPath: /root/.openclaw/runtime-config, subPath: openclaw/runtime-config }
      containers:
        - name: openclaw
          image: git.leopaska.xyz/leo/frack-openclaw:homelab
          imagePullPolicy: Always
          command: ["node", "/opt/openclaw/openclaw.mjs"]
          args:
            - "gateway"
            - "--port=18789"
            - "--bind=lan"
            - "--allow-unconfigured"
          env:
            - name: AGENT_NAME
              value: "Frack"
            - name: AGENT_ID
              value: "frack"
            # Point OpenClaw at the WRITABLE copy of the persona config
            # seeded into /root/.openclaw/runtime-config/ by the
            # seed-workspace init container. OpenClaw needs to write the
            # config back at boot to persist plugin auto-enable + auth
            # token bookkeeping; the source ConfigMap mount is read-only
            # so it 401s with EBUSY rename.
            - name: OPENCLAW_CONFIG
              value: "/root/.openclaw/runtime-config/openclaw.json"
            - name: OPENCLAW_CONFIG_PATH
              value: "/root/.openclaw/runtime-config/openclaw.json"
            - name: OPENCLAW_WORKSPACE
              value: "/root/.openclaw/workspace-rw"
            - name: TZ
              value: "America/New_York"
            - name: HARDSTOP_PATH
              value: "/data/HARDSTOP-FRACK"
            # OpenClaw's built-in agent runtime defaults to openai/gpt-5.5
            # when no explicit `--model` is passed (cron jobs, heartbeat
            # checks, sub-agent spawn). Its `openai` provider checks
            # OPENAI_API_KEY / OPENAI_BASE_URL env directly. Point both
            # at the cluster LiteLLM proxy so default-model paths
            # resolve to vllm-chat (gpt-5.5 is a model_group_alias).
            - name: OPENAI_API_KEY
              valueFrom:
                secretKeyRef:
                  name: frack-secrets
                  key: LITELLM_API_KEY
            - name: OPENAI_BASE_URL
              value: "http://litellm.inference.svc.cluster.local:4000/v1"
          envFrom:
            - secretRef:
                name: frack-secrets
          ports:
            - name: gateway
              containerPort: 18789
              protocol: TCP
          livenessProbe:
            httpGet:
              path: /healthz
              port: gateway
            initialDelaySeconds: 30
            periodSeconds: 30
            failureThreshold: 5
          readinessProbe:
            httpGet:
              path: /readyz
              port: gateway
            initialDelaySeconds: 5
            periodSeconds: 10
          resources:
            requests:
              cpu: "500m"
              memory: "2Gi"
            limits:
              memory: "8Gi"
          volumeMounts:
            - name: state
              mountPath: /root/.openclaw
              subPath: openclaw
            - name: state
              mountPath: /data
              subPath: hardstop
            # The agent's persona-seeded workspace lives on the state PVC
            # under `openclaw/workspace`. The init container copies the
            # persona ConfigMap into it at startup; OpenClaw can then
            # write its `.openclaw/` runtime state alongside.
            - { name: state, mountPath: /root/.openclaw/workspace-rw, subPath: openclaw/workspace }
            # Seeded by the init container — writable copy of openclaw.json.
            - { name: state, mountPath: /root/.openclaw/runtime-config, subPath: openclaw/runtime-config }
            # OpenClaw's workspace bootstrap falls back to packaged templates
            # at /opt/openclaw/docs/reference/templates. The homelab image does
            # not currently package docs/, so expose the same bootstrap files
            # from the persona ConfigMap to keep heartbeat/cron bootstrap alive.
            - name: persona
              mountPath: /opt/openclaw/docs/reference/templates
              readOnly: true
            # NOTE: source openclaw-config ConfigMap is mounted in the
            # seed-workspace initContainer and copied to a writable
            # path under /root/.openclaw/runtime-config/. The main
            # container reads only the writable copy.
            - name: skills
              mountPath: /root/.openclaw/skills
              readOnly: true
            # ── Longhorn-RWX graph mounts ──────────────────────────────
            # Same five PVCs Vetinari + Sancho + syncthing-graphs mount.
            # Frack RW on its own; restricted-write on Leo's; RO on the
            # other three siblings'. Per-file write enforcement at the
            # OpenClaw runtime layer (memorySearch.writableGraphs in
            # openclaw.json — see openclaw-configs/frack/openclaw.json).
            - { name: graph-frack,    mountPath: /data/graphs/frack }
            - { name: graph-frick,    mountPath: /data/graphs/frick,    readOnly: true }
            - { name: graph-sancho,   mountPath: /data/graphs/sancho,   readOnly: true }
            - { name: graph-vetinari, mountPath: /data/graphs/vetinari, readOnly: true }
            - { name: graph-quirm,    mountPath: /data/graphs/quirm,    readOnly: true }
            - { name: graph-vimes,    mountPath: /data/graphs/vimes,    readOnly: true }
            - { name: graph-puck,     mountPath: /data/graphs/puck,     readOnly: true }
            - { name: graph-leo,      mountPath: /data/graphs/leo }
              # NOT readOnly — Frack writes to pages/world/businesses.md
              # and pages/world/open-loops.md per HANDOFF.md §4.
      volumes:
        - { name: state,           persistentVolumeClaim: { claimName: frack-state } }
        - { name: persona,         configMap: { name: frack-persona } }
        - { name: openclaw-config, configMap: { name: frack-openclaw-config } }
        - { name: skills,          configMap: { name: frack-skills, optional: true } }
        - { name: graph-frack,     persistentVolumeClaim: { claimName: frack-graph } }
        - { name: graph-frick,     persistentVolumeClaim: { claimName: frick-graph } }
        - { name: graph-sancho,    persistentVolumeClaim: { claimName: sancho-graph } }
        - { name: graph-vetinari,  persistentVolumeClaim: { claimName: vetinari-graph } }
        - { name: graph-quirm,     persistentVolumeClaim: { claimName: quirm-graph } }
        - { name: graph-vimes,     persistentVolumeClaim: { claimName: vimes-graph } }
        - { name: graph-puck,      persistentVolumeClaim: { claimName: puck-graph } }
        - { name: graph-leo,       persistentVolumeClaim: { claimName: leo-graph } }
      imagePullSecrets:
        - name: forgejo-registry-credentials
