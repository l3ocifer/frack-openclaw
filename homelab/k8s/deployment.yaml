---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: frack
  namespace: agents-shared
  labels:
    app.kubernetes.io/name: frack
    app.kubernetes.io/component: agent
spec:
  replicas: 1
  strategy:
    type: Recreate  # state PVC is RWO; only one pod can mount at a time
  selector:
    matchLabels:
      app.kubernetes.io/name: frack
  template:
    metadata:
      labels:
        app.kubernetes.io/name: frack
        app.kubernetes.io/component: agent
      annotations:
        kustomize.toolkit.fluxcd.io/reconcile: enabled
    spec:
      # ── Scheduling ─────────────────────────────────────────────────
      # NO hard nodeSelector — Frack floats. Soft preference for
      # `thebeast` because the businesses workload is heaviest and
      # thebeast has the most headroom + the production-app namespaces
      # Frack operates against are pinned there. The scheduler is
      # free to land Frack on alef when thebeast is drained / cordoned.
      affinity:
        nodeAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 80
              preference:
                matchExpressions:
                  - key: kubernetes.io/hostname
                    operator: In
                    values: [thebeast]
            - weight: 20
              preference:
                matchExpressions:
                  - key: kubernetes.io/hostname
                    operator: In
                    values: [alef]
      serviceAccountName: frack-ops
      restartPolicy: Always
      securityContext:
        runAsNonRoot: false  # OpenClaw expects /root/.openclaw
        fsGroup: 0
      initContainers:
        # OpenClaw writes runtime state (`.openclaw/`, sessions, caches) into
        # OPENCLAW_WORKSPACE, but our persona ConfigMap is an inherently
        # read-only tmpfs. Seed the writable workspace by copying the
        # persona files in at startup so SOUL.md / AGENTS.md / IDENTITY.md
        # / etc. land in the workspace tree the agent actually uses.
        # Also seed the per-agent auth profile + models registry so the
        # default `main` agent can route inference through LiteLLM
        # without requiring an interactive `openclaw infer model auth login`.
        - name: seed-workspace
          image: busybox:1.37
          command: ["sh", "-c"]
          envFrom:
            - secretRef: { name: frack-secrets }
          args:
            - |
              set -eu
              mkdir -p /workspace /agent-state
              cp -f /persona/*.md /workspace/ 2>/dev/null || true
              ls -la /workspace
              # Per-agent auth-profiles.json — flat provider->credential map.
              # We point both `litellm` (catalog provider) and `openai`
              # (default-fallback provider in OpenClaw's built-in agent
              # runtime) at the same LiteLLM endpoint so every model the
              # built-in catalog references — including `claude-opus-4-6`
              # and `gpt-5.5` — is served by our cluster proxy.
              cat > /agent-state/auth-profiles.json <<JSON
              {
                "litellm": {
                  "type": "api_key",
                  "apiKey": "${LITELLM_API_KEY}",
                  "baseUrl": "http://litellm.inference.svc.cluster.local:4000/v1"
                },
                "openai": {
                  "type": "api_key",
                  "apiKey": "${LITELLM_API_KEY}",
                  "baseUrl": "http://litellm.inference.svc.cluster.local:4000/v1"
                }
              }
              JSON
              # Per-agent models.json — register the LiteLLM model
              # catalog so the agent can pick chat/long/code/frontier
              # without relying on the global model catalog.
              cat > /agent-state/models.json <<JSON
              {
                "providers": {
                  "litellm": {
                    "baseUrl": "http://litellm.inference.svc.cluster.local:4000/v1",
                    "api": "openai-completions",
                    "apiKey": "${LITELLM_API_KEY}",
                    "models": [
                      {"id":"chat","name":"LiteLLM chat","contextWindow":32768,"maxTokens":8192,"input":["text"],"cost":{"input":0,"output":0,"cacheRead":0,"cacheWrite":0}},
                      {"id":"long","name":"LiteLLM long","contextWindow":131072,"maxTokens":8192,"input":["text"],"cost":{"input":0,"output":0,"cacheRead":0,"cacheWrite":0}},
                      {"id":"code","name":"LiteLLM code","contextWindow":32768,"maxTokens":8192,"input":["text"],"cost":{"input":0,"output":0,"cacheRead":0,"cacheWrite":0}},
                      {"id":"frontier","name":"LiteLLM frontier","contextWindow":200000,"maxTokens":8192,"input":["text"],"cost":{"input":0,"output":0,"cacheRead":0,"cacheWrite":0}}
                    ]
                  }
                },
                "defaults": {
                  "primary": "litellm/long",
                  "fallbacks": ["litellm/chat"]
                }
              }
              JSON
              chmod 600 /agent-state/auth-profiles.json
              ls -la /agent-state/
          volumeMounts:
            - { name: state, mountPath: /workspace,   subPath: openclaw/workspace }
            - { name: state, mountPath: /agent-state, subPath: openclaw/agents/main/agent }
            - { name: persona, mountPath: /persona,   readOnly: true }
      containers:
        - name: openclaw
          image: ghcr.io/l3ocifer/frack-openclaw:homelab
          imagePullPolicy: Always
          command: ["node", "/opt/openclaw/openclaw.mjs"]
          args:
            - "gateway"
            - "--port=18789"
            - "--bind=lan"
            - "--allow-unconfigured"
          env:
            - name: AGENT_NAME
              value: "Frack"
            - name: AGENT_ID
              value: "frack"
            # Point OpenClaw at the persona ConfigMap mount. The 2026-05-05
            # config-schema migration brought all blocks into alignment with
            # the upstream OpenClawSchema (apiKey secret refs, tools.profile
            # enum, tools.exec.{security,ask} enums, gateway.mode=local).
            # Without this, OpenClaw boots with the auto-generated empty
            # /tmp/openclaw-missing.json and our model/provider/channel
            # blocks are silently ignored — embedded harness then hits
            # api.openai.com directly with the LiteLLM key and 401s.
            - name: OPENCLAW_CONFIG
              value: "/root/.openclaw/openclaw.json"
            - name: OPENCLAW_CONFIG_PATH
              value: "/root/.openclaw/openclaw.json"
            - name: OPENCLAW_WORKSPACE
              value: "/root/.openclaw/workspace-rw"
            - name: TZ
              value: "America/New_York"
            - name: HARDSTOP_PATH
              value: "/data/HARDSTOP-FRACK"
            # OpenClaw's built-in agent runtime defaults to openai/gpt-5.5
            # when no explicit `--model` is passed (cron jobs, heartbeat
            # checks, sub-agent spawn). Its `openai` provider checks
            # OPENAI_API_KEY / OPENAI_BASE_URL env directly. Point both
            # at the cluster LiteLLM proxy so default-model paths
            # resolve to vllm-chat (gpt-5.5 is a model_group_alias).
            - name: OPENAI_API_KEY
              valueFrom:
                secretKeyRef:
                  name: frack-secrets
                  key: LITELLM_API_KEY
            - name: OPENAI_BASE_URL
              value: "http://litellm.inference.svc.cluster.local:4000/v1"
          envFrom:
            - secretRef:
                name: frack-secrets
          ports:
            - name: gateway
              containerPort: 18789
              protocol: TCP
            - name: metrics
              containerPort: 9100
              protocol: TCP
          livenessProbe:
            httpGet:
              path: /healthz
              port: gateway
            initialDelaySeconds: 30
            periodSeconds: 30
            failureThreshold: 5
          readinessProbe:
            httpGet:
              path: /readyz
              port: gateway
            initialDelaySeconds: 5
            periodSeconds: 10
          resources:
            requests:
              cpu: "500m"
              memory: "2Gi"
            limits:
              memory: "8Gi"
          volumeMounts:
            - name: state
              mountPath: /root/.openclaw
              subPath: openclaw
            - name: state
              mountPath: /data
              subPath: hardstop
            # The agent's persona-seeded workspace lives on the state PVC
            # under `openclaw/workspace`. The init container copies the
            # persona ConfigMap into it at startup; OpenClaw can then
            # write its `.openclaw/` runtime state alongside.
            - { name: state, mountPath: /root/.openclaw/workspace-rw, subPath: openclaw/workspace }
            # OpenClaw's workspace bootstrap falls back to packaged templates
            # at /opt/openclaw/docs/reference/templates. The homelab image does
            # not currently package docs/, so expose the same bootstrap files
            # from the persona ConfigMap to keep heartbeat/cron bootstrap alive.
            - name: persona
              mountPath: /opt/openclaw/docs/reference/templates
              readOnly: true
            - name: openclaw-config
              mountPath: /root/.openclaw/openclaw.json
              subPath: openclaw.json
              readOnly: true
            - name: skills
              mountPath: /root/.openclaw/skills
              readOnly: true
            # ── Longhorn-RWX graph mounts ──────────────────────────────
            # Same five PVCs Vetinari + Sancho + syncthing-graphs mount.
            # Frack RW on its own; restricted-write on Leo's; RO on the
            # other three siblings'. Per-file write enforcement at the
            # OpenClaw runtime layer (memorySearch.writableGraphs in
            # openclaw.json — see openclaw-configs/frack/openclaw.json).
            - { name: graph-frack,    mountPath: /data/graphs/frack }
            - { name: graph-frick,    mountPath: /data/graphs/frick,    readOnly: true }
            - { name: graph-sancho,   mountPath: /data/graphs/sancho,   readOnly: true }
            - { name: graph-vetinari, mountPath: /data/graphs/vetinari, readOnly: true }
            - { name: graph-quirm,    mountPath: /data/graphs/quirm,    readOnly: true }
            - { name: graph-vimes,    mountPath: /data/graphs/vimes,    readOnly: true }
            - { name: graph-puck,     mountPath: /data/graphs/puck,     readOnly: true }
            - { name: graph-leo,      mountPath: /data/graphs/leo }
              # NOT readOnly — Frack writes to pages/world/businesses.md
              # and pages/world/open-loops.md per HANDOFF.md §4.
      volumes:
        - { name: state,           persistentVolumeClaim: { claimName: frack-state } }
        - { name: persona,         configMap: { name: frack-persona } }
        - { name: openclaw-config, configMap: { name: frack-openclaw-config } }
        - { name: skills,          configMap: { name: frack-skills, optional: true } }
        - { name: graph-frack,     persistentVolumeClaim: { claimName: frack-graph } }
        - { name: graph-frick,     persistentVolumeClaim: { claimName: frick-graph } }
        - { name: graph-sancho,    persistentVolumeClaim: { claimName: sancho-graph } }
        - { name: graph-vetinari,  persistentVolumeClaim: { claimName: vetinari-graph } }
        - { name: graph-quirm,     persistentVolumeClaim: { claimName: quirm-graph } }
        - { name: graph-vimes,     persistentVolumeClaim: { claimName: vimes-graph } }
        - { name: graph-puck,      persistentVolumeClaim: { claimName: puck-graph } }
        - { name: graph-leo,       persistentVolumeClaim: { claimName: leo-graph } }
      imagePullSecrets:
        - name: ghcr-credentials
