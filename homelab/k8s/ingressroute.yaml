---
# Traefik IngressRoute — exposes Frack at frack.leopaska.xyz with
# Authelia in front (per home-services.yaml convention).
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: frack
  namespace: agents-shared
spec:
  # Cloudflare terminates TLS and the tunnel speaks plain HTTP to Traefik's
  # `web` entrypoint; a websecure-only router, a `tls:` block (TLS-only
  # routers on every entrypoint) or a cross-namespace middleware ref
  # (allowCrossNamespace is off) each make Traefik drop the router -> 404.
  entryPoints: [web]
  routes:
    - match: Host(`frack.leopaska.xyz`)
      kind: Rule
      services:
        - name: frack
          namespace: agents-shared
          port: 18789
      middlewares:
        - name: authelia   # agents-shared copy, homelab infrastructure/authelia-middleware.yaml

# ServiceMonitor removed (homelab#47): this OpenClaw build exposes no
# Prometheus /metrics endpoint (the gateway answers with the control-UI
# SPA), so the scrape target was permanently down and TargetDown fired
# forever. Re-add together with a real exporter.
