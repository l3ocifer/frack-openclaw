apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

# Frack — OpenClaw headless gateway. Floats across the cluster.
# Lives in `agents-shared` alongside Vetinari, Sancho, the graph PVCs,
# and the syncthing-graphs pod. See homelab/README.md and
# homelab/config/SOUL.md.
#
# NOTE: This kustomization deliberately omits a top-level `namespace:`
# directive. Frack's RBAC includes per-namespace Roles for ten business
# namespaces (potluck, blink-platform, ursulai, omnilemma, hyvapaska,
# githired, chimera, ae, lunasea, authorworks, trade). A
# `namespace: agents-shared` directive would rewrite every Role's
# namespace to `agents-shared`, producing ten Roles with the same name
# in the same namespace — kustomize rejects that with an "ID conflict"
# error.
#
# Each resource sets its own metadata.namespace explicitly:
#   pvc.yaml, service.yaml, ingressroute.yaml, deployment.yaml -> agents-shared
#   rbac.yaml                                                    -> per-namespace

resources:
  - pvc.yaml
  - rbac.yaml
  - service.yaml
  - ingressroute.yaml
  - deployment.yaml

configMapGenerator:
  - name: frack-persona
    files:
      - SOUL.md=../config/SOUL.md
      - TOOLS.md=../config/TOOLS.md
      - AGENTS.md=../shared/openclaw-configs/shared/AGENTS.md
      - HANDOFF.md=../shared/openclaw-configs/shared/HANDOFF.md
      - KILLSWITCH.md=../shared/openclaw-configs/shared/KILLSWITCH.md
      - USER.md=../shared/openclaw-configs/shared/USER.md
  - name: frack-openclaw-config
    files:
      - openclaw.json=../config/openclaw.json

generatorOptions:
  disableNameSuffixHash: false

commonLabels:
  app.kubernetes.io/name: frack
  app.kubernetes.io/part-of: agents
  app.kubernetes.io/managed-by: argocd
