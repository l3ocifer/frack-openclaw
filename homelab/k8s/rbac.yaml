---
# Frack's ServiceAccount — used by the pod to authenticate with kubectl
# against the business app namespaces.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: frack-ops
  namespace: frack

---
# Frack's own namespace — full control (it's its own house).
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: frack-self
  namespace: frack
rules:
  - apiGroups: [""]
    resources: ["pods", "pods/log", "pods/exec", "configmaps", "secrets", "events"]
    verbs: ["get", "list", "watch", "create", "patch"]
  - apiGroups: ["apps"]
    resources: ["deployments", "replicasets"]
    verbs: ["get", "list", "watch", "patch"]

---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: frack-self
  namespace: frack
subjects:
  - kind: ServiceAccount
    name: frack-ops
    namespace: frack
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: frack-self

# ─────────────────────────────────────────────────────────────────────
# Business app namespace bindings.
#
# YAML anchors (&foo / *foo) do NOT carry across `---` document
# separators when the file is consumed document-by-document (which is
# what kustomize does). They worked when this file was rendered by a
# single YAML parser pass, but break with kustomize accumulation. The
# Role spec below is therefore inlined in every namespace rather than
# anchored once. If we add another business namespace, copy the whole
# Role+RoleBinding block and change the namespace.
#
# Frack's policy in every business namespace:
#   • read everything except secrets
#   • restart pods (delete on pods is rolling restart only)
#   • shell into pods
#   • NO delete on pvc/deployment/secret/configmap/service/ingress
# ─────────────────────────────────────────────────────────────────────

---
# potluck
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: frack-business-ops
  namespace: potluck
rules:
  - apiGroups: [""]
    resources: ["pods", "events", "services", "configmaps", "endpoints"]
    verbs: ["get", "list", "watch"]
  - apiGroups: [""]
    resources: ["pods/log"]
    verbs: ["get", "list"]
  - apiGroups: [""]
    resources: ["pods/exec"]
    verbs: ["create"]
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["delete"]
  - apiGroups: ["apps"]
    resources: ["deployments", "replicasets", "statefulsets"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["networking.k8s.io"]
    resources: ["ingresses"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["traefik.io"]
    resources: ["ingressroutes", "middlewares"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["argoproj.io"]
    resources: ["applications"]
    verbs: ["get", "list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: frack-business-ops
  namespace: potluck
subjects:
  - kind: ServiceAccount
    name: frack-ops
    namespace: frack
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: frack-business-ops

