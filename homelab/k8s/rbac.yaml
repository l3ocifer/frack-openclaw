---
# Cluster-wide read-only (apps + nodes only) for whole-cluster
# observability — but nothing destructive.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: frack-cluster-readonly
rules:
  - apiGroups: ["argoproj.io"]
    resources: ["applications", "applicationsets"]
    verbs: ["get", "list", "watch"]
  - apiGroups: [""]
    resources: ["nodes", "namespaces"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["metrics.k8s.io"]
    resources: ["nodes", "pods"]
    verbs: ["get", "list"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: frack-cluster-readonly
subjects:
  - kind: ServiceAccount
    name: frack-ops
    namespace: frack
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: frack-cluster-readonly
