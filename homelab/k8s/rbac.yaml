---
# Frack's ServiceAccount — used by the pod to authenticate with kubectl
# against the business app namespaces.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: frack-ops
  namespace: frack

---
# Frack's own namespace — full control (it's its own house).
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: frack-self
  namespace: frack
rules:
  - apiGroups: [""]
    resources: ["pods", "pods/log", "pods/exec", "configmaps", "secrets", "events"]
    verbs: ["get", "list", "watch", "create", "patch"]
  - apiGroups: ["apps"]
    resources: ["deployments", "replicasets"]
    verbs: ["get", "list", "watch", "patch"]

---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: frack-self
  namespace: frack
subjects:
  - kind: ServiceAccount
    name: frack-ops
    namespace: frack
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: frack-self

---
# ─────────────────────────────────────────────────────────────────────
# Business app namespace bindings.
# Frack gets the same Role (defined once below) replicated across
# every business app namespace via RoleBinding. The Role is namespace-
# scoped (no ClusterRole) so we instantiate it per-namespace.
# ─────────────────────────────────────────────────────────────────────

---
# Reusable Role — instantiate in each business namespace below.
# (k8s requires the Role to exist in each namespace; we duplicate
# the spec below per namespace for clarity.)
# Role definition is the same in every namespace:
#   • read everything except secrets
#   • restart pods
#   • shell into pods
#   • NO delete on pvc/deployment/secret/configmap/service/ingress

# potluck
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: frack-business-ops
  namespace: potluck
rules: &businessOpsRules
  - apiGroups: [""]
    resources: ["pods", "events", "services", "configmaps", "endpoints"]
    verbs: ["get", "list", "watch"]
  - apiGroups: [""]
    resources: ["pods/log"]
    verbs: ["get", "list"]
  - apiGroups: [""]
    resources: ["pods/exec"]
    verbs: ["create"]
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["delete"]  # rolling restart only (pods are cattle)
  - apiGroups: ["apps"]
    resources: ["deployments", "replicasets", "statefulsets"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["networking.k8s.io"]
    resources: ["ingresses"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["traefik.io"]
    resources: ["ingressroutes", "middlewares"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["argoproj.io"]
    resources: ["applications"]
    verbs: ["get", "list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: frack-business-ops
  namespace: potluck
subjects: &frackOpsSubject
  - kind: ServiceAccount
    name: frack-ops
    namespace: frack
roleRef: &businessOpsRoleRef
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: frack-business-ops

---
# blink-platform
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: frack-business-ops
  namespace: blink-platform
rules: *businessOpsRules
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: frack-business-ops
  namespace: blink-platform
subjects: *frackOpsSubject
roleRef: *businessOpsRoleRef

