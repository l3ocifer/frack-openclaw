---
apiVersion: v1
kind: Service
metadata:
  name: frack
  namespace: agents-shared
  labels:
    app.kubernetes.io/name: frack
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: frack
  ports:
    - name: gateway
      port: 18789
      targetPort: gateway
      protocol: TCP
    - name: metrics
      port: 9100
      targetPort: metrics
      protocol: TCP
